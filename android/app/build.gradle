plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mindfultools.exhale"
    compileSdk = 35 // Required for plugins
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Unique Application ID for Play Store
        applicationId = "com.mindfultools.exhale"
        // Updated for Play Store requirements
        minSdk = 24 // Required for flutter_sound plugin
        targetSdk = 34 // Required for Play Store (Android 14)
        versionCode = 2 // Increment for Play Store upload
        versionName = "1.1.0" // Match our release version
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
